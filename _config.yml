title: Henry Starr
description: >-
  Henry Starr’s blog about software and AI.
author: Henry Starr
location: College Park, MD
email: henry.j.starr@gmail.com
url: "https://www.henryjstarr.com"
baseurl: ""

# Custom layouts and CSS own the design. Disable GitHub Pages' implicit Primer
# theme, whose generated assets/css/style.css would overwrite this stylesheet.
theme: null

# Supabase project used by the email subscribe form (assets/js/subscribe.js).
# The publishable key is safe to expose client-side. Subscriber inserts also
# require a verified reader session; RLS restricts inserts to that user’s email.
supabase_url: "https://sczheyjdrpbfkzlteyou.supabase.co"
supabase_publishable_key: "sb_publishable_x6IW1iXRAmsTfLEq051RVg_4uqbsNDF"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - output
  - scripts
  - .playwright-cli
  - supabase
  - tests
