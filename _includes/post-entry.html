<li class="post-entry" data-search="{{ include.post.title | append: ' ' | append: include.post.content | strip_html | normalize_whitespace | escape }}" data-topics="{{ include.post.tags | jsonify | escape }}">
  <article>
    {% include post-meta.html post=include.post %}
    {% assign heading = include.heading | default: 3 %}<h{{ heading }} class="post-entry-title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h{{ heading }}>
    <p class="post-entry-excerpt">{{ include.post.description | default: include.post.excerpt | strip_html | normalize_whitespace | truncate: 200 | escape }}</p>
  </article>
</li>
