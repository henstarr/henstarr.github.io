<div class="modal-overlay" id="signin-overlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="signin-title">
    <button type="button" class="modal-close" id="signin-close" aria-label="Close">&times;</button>
    <img class="modal-avatar" src="{{ '/assets/img/henry-portrait.jpg' | relative_url }}" alt="">
    <h2 class="modal-title" id="signin-title">Sign in</h2>
    <p class="modal-sub">We'll email you a link — no password needed.</p>
    <form id="signin-form" class="modal-form" novalidate>
      <input type="email" id="signin-email" placeholder="you@email.com" autocomplete="email" required>
      <button type="submit">Send magic link</button>
    </form>
    <p class="modal-status" id="signin-status" role="status" aria-live="polite"></p>
  </div>
</div>

<div class="modal-overlay" id="intro-overlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="intro-title">
    <button type="button" class="modal-close" id="intro-close" aria-label="Close">&times;</button>
    <img class="modal-avatar" src="{{ '/assets/img/henry-portrait.jpg' | relative_url }}" alt="">
    <h2 class="modal-title" id="intro-title">Discover more from {{ site.title }}</h2>
    <form id="intro-subscribe-form" class="modal-form" novalidate>
      <input type="email" id="intro-email" placeholder="Enter your email&hellip;" autocomplete="email" required>
      <button type="submit">Subscribe</button>
    </form>
    <p class="modal-status" id="intro-status" role="status" aria-live="polite"></p>
    <p class="modal-footnote">Already have an account? <a href="#" id="intro-signin-link">Sign in</a></p>
  </div>
</div>

<div class="modal-overlay" id="postsignin-overlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="postsignin-title">
    <button type="button" class="modal-close" id="postsignin-close" aria-label="Close">&times;</button>
    <img class="modal-avatar" src="{{ '/assets/img/henry-portrait.jpg' | relative_url }}" alt="">
    <h2 class="modal-title" id="postsignin-title">Get new posts by email</h2>
    <p class="modal-sub" id="postsignin-sub">Send new posts to your inbox?</p>
    <button type="button" class="modal-button" id="postsignin-subscribe-button">Subscribe</button>
    <p class="modal-status" id="postsignin-status" role="status" aria-live="polite"></p>
  </div>
</div>

<div class="modal-overlay" id="account-overlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="account-title">
    <button type="button" class="modal-close" id="account-close" aria-label="Close">&times;</button>
    <h2 class="modal-title" id="account-title">Account</h2>
    <p class="account-email" id="account-email"></p>

    <form id="account-name-form" class="account-field">
      <label for="account-name">Display name</label>
      <div class="account-field-row">
        <input type="text" id="account-name" placeholder="How you appear on comments" maxlength="60">
        <button type="submit">Save</button>
      </div>
    </form>
    <p class="modal-status" id="account-status" role="status" aria-live="polite"></p>

    <button type="button" class="account-signout" id="account-signout">Sign out</button>
  </div>
</div>
