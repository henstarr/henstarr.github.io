<dialog class="modal-card" id="signin-dialog" aria-labelledby="signin-title" aria-describedby="signin-description">
  <button type="button" class="modal-close" data-close-dialog aria-label="Close sign in">&times;</button>
  <h2 class="modal-title" id="signin-title">Welcome back.</h2>
  <p class="modal-sub" id="signin-description">Sign in to like posts and join the conversation. We’ll email you a link. No password needed.</p>
  <form id="signin-form" class="modal-form"><label for="signin-email">Email address</label><input type="email" id="signin-email" placeholder="you@example.com" autocomplete="email" required maxlength="254" aria-describedby="signin-status" autofocus><button type="submit" class="button">Send sign-in link <span aria-hidden="true">↗</span></button></form>
  <p class="modal-status" id="signin-status" role="status" aria-live="polite"></p>
</dialog>
<dialog class="modal-card" id="account-dialog" aria-labelledby="account-title">
  <button type="button" class="modal-close" data-close-dialog aria-label="Close account">&times;</button>
  <h2 class="modal-title" id="account-title">Your account.</h2>
  <p class="account-email" id="account-email"></p>
  <form id="account-name-form" class="modal-form"><label for="account-name">Display name</label><input type="text" id="account-name" placeholder="How you appear on comments" maxlength="60" required autocomplete="nickname"><button type="submit" class="button">Save name</button></form>
  <p class="modal-status" id="account-status" role="status" aria-live="polite"></p>
  <button type="button" class="account-signout" id="account-signout">Sign out</button>
</dialog>
