<div class="subscribe" id="subscribe">
  <p class="subscribe-label">Get new posts by email</p>
  <form id="subscribe-form" class="subscribe-row" novalidate>
    <input
      type="email"
      name="email"
      id="subscribe-email"
      placeholder="you@email.com"
      autocomplete="email"
      required>
    <button type="submit">Subscribe</button>
  </form>
  <p class="subscribe-status" id="subscribe-status" role="status" aria-live="polite"></p>
  <p class="subscribe-fineprint">No spam. Unsubscribe anytime.</p>
</div>
