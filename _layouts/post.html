---
layout: default
---
<article class="post">
  <p class="post-meta"><a href="{{ '/blog/' | relative_url }}" class="back-link">&larr; Blog</a> · {{ page.date | date: "%B %-d, %Y" }}</p>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-content">
    {{ content }}
  </div>
</article>
