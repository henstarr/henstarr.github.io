<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body class="landing">
  <div class="landing-wrap">
    <p class="landing-eyebrow">{{ site.author | upcase }} &middot; {{ site.location | upcase }}</p>

    <div class="landing-bio">
      {{ content }}
    </div>

    <div class="landing-photo">
      <img src="{{ '/assets/img/henry-portrait.jpg' | relative_url }}" alt="{{ site.author }}">
    </div>
  </div>

  <footer class="landing-footer">
    <a class="landing-footer-email" href="mailto:{{ site.email }}">{{ site.email }}</a>
    <div class="landing-footer-links">
      <a href="https://github.com/henstarr" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/henrystarr/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="{{ '/assets/files/HS_Resume_Dec2024.pdf' | relative_url }}" target="_blank" rel="noopener">R&eacute;sum&eacute;</a>
    </div>
  </footer>
</body>
</html>
