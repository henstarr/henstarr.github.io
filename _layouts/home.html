---
layout: default
---
<header class="home-intro"><h1>Posts</h1><p class="intro-description">Software, AI, and projects.</p></header>
<div class="home-posts">
  <ul class="post-list">{% for post in site.posts limit: 6 %}{% include post-entry.html post=post heading=2 %}{% endfor %}</ul>
  {% if site.posts.size > 6 %}<p class="archive-link"><a href="{{ '/blog/' | relative_url }}">All posts</a></p>{% endif %}
  {% if site.posts.size == 0 %}<p>No posts yet.</p>{% endif %}
</div>
